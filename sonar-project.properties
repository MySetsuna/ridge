sonar.projectKey=MySetsuna_ridge
sonar.projectName=Ridge
sonar.host.url=http://127.0.0.1:9000
sonar.sourceEncoding=UTF-8

sonar.sources=src,packages,src-tauri/src,scripts
sonar.tests=src,packages,scripts
sonar.exclusions=**/*.test.*,**/*.spec.*,**/node_modules/**,**/target/**,**/dist/**,**/remote-dist/**,**/.svelte-kit/**,**/.claude/**,**/.claude/worktrees/**,**/.tools/**,**/public/**,**/coverage/**,**/*.png,**/*.woff2,packages/ridge-term/pkg/**
sonar.test.inclusions=**/*.test.*,**/*.spec.*
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.rust.lcov.reportPaths=coverage/rust.lcov
# Keep Sonar's TypeScript program discovery inside this repository. The default
# recursive discovery also walks .claude/worktrees snapshots, which are not
# product sources and can add stale/broken tsconfig files and minutes of scan
# time without changing the indexed source set or LCOV coverage.
sonar.typescript.tsconfigPaths=tsconfig.json,packages/remote/tsconfig.json,packages/rg-split/tsconfig.json,packages/rg-split/examples/tsconfig.json
