sonar.projectKey=MySetsuna_ridge
sonar.projectName=Ridge
sonar.host.url=http://127.0.0.1:9000
sonar.sourceEncoding=UTF-8

sonar.sources=src,packages,src-tauri/src,scripts
sonar.tests=src,packages,scripts
# CDP/E2E/weak-network/remote smoke modules are executable verification
# harnesses, not product modules. Keep them in Sonar's test inventory so the
# full source scan still covers build, release, validation, and runtime
# helpers under scripts/ without counting test-driver orchestration as product.
sonar.exclusions=**/*.test.*,**/*.spec.*,**/*.svelte,**/node_modules/**,**/target/**,**/dist/**,**/remote-dist/**,**/.svelte-kit/**,**/.claude/**,**/.claude/worktrees/**,**/.iteration/**,**/.tools/**,**/public/**,**/coverage/**,**/*.png,**/*.woff2,packages/ridge-term/pkg/**
sonar.test.inclusions=**/*.test.*,**/*.spec.*,scripts/cdp-*.mjs,scripts/*-e2e.mjs,scripts/*-test.mjs,scripts/mobile-keyboard-e2e.mjs,scripts/remote-*.mjs,scripts/run-weaknet-lab.mjs,scripts/validate-remote-smoke-evidence.mjs,scripts/verify-remote-pwa-build.mjs
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Rust LCOV is not produced by the current test workflow; leaving this unset
# avoids Sonar recursively resolving a missing report through transient worktrees.
# TypeScript type-aware analysis is intentionally disabled here: the repository
# contains transient worktrees with incomplete dependency junctions; the
# syntax/coverage analysis remains enabled for the configured source roots.
