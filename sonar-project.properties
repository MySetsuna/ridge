sonar.projectKey=MySetsuna_ridge
sonar.projectName=Ridge
sonar.host.url=http://127.0.0.1:9000
sonar.sourceEncoding=UTF-8

sonar.sources=src,packages,src-tauri/src
sonar.tests=src,packages
# scripts/ contains one-off CDP and PowerShell-adjacent harnesses; it is kept
# out of the product scan because Sonar's JS sensor cannot type-analyse these
# standalone modules consistently on Windows.
sonar.exclusions=**/*.test.*,**/*.spec.*,**/*.svelte,**/node_modules/**,**/target/**,**/dist/**,**/remote-dist/**,**/.svelte-kit/**,**/.claude/**,**/.claude/worktrees/**,**/.iteration/**,**/.tools/**,**/public/**,**/coverage/**,**/*.png,**/*.woff2,packages/ridge-term/pkg/**
sonar.test.inclusions=**/*.test.*,**/*.spec.*
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Rust LCOV is not produced by the current test workflow; leaving this unset
# avoids Sonar recursively resolving a missing report through transient worktrees.
# TypeScript type-aware analysis is intentionally disabled here: the repository
# contains transient worktrees with incomplete dependency junctions; the
# syntax/coverage analysis remains enabled for the configured source roots.
