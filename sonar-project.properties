sonar.projectKey=MySetsuna_ridge
sonar.projectName=Ridge
sonar.host.url=http://127.0.0.1:9000
sonar.sourceEncoding=UTF-8

sonar.sources=src,packages,src-tauri/src,scripts
sonar.tests=src,packages,scripts
sonar.exclusions=**/*.test.*,**/*.spec.*,**/node_modules/**,**/target/**,**/dist/**,**/remote-dist/**,**/.svelte-kit/**,**/.claude/**,**/.claude/worktrees/**,**/.iteration/**,**/.tools/**,**/public/**,**/coverage/**,**/*.png,**/*.woff2,packages/ridge-term/pkg/**
sonar.test.inclusions=**/*.test.*,**/*.spec.*
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.rust.lcov.reportPaths=coverage/rust.lcov
