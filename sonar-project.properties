sonar.projectKey=MySetsuna_ridge
sonar.projectName=Ridge
sonar.host.url=http://127.0.0.1:9000
sonar.sourceEncoding=UTF-8

sonar.sources=src,packages,src-tauri/src,scripts
sonar.tests=src,packages
# CDP/E2E/weak-network/remote smoke modules are executable verification
# harnesses. Keep them in the source scan for static quality checks, while
# test ownership remains limited to the real src/packages test trees.
sonar.exclusions=**/*.test.*,**/*.spec.*,**/*.svelte,**/node_modules/**,**/target/**,**/dist/**,**/remote-dist/**,**/.svelte-kit/**,**/.claude/**,**/.claude/worktrees/**,**/.iteration/**,**/.tools/**,**/public/**,**/coverage/**,**/*.png,**/*.woff2,packages/ridge-term/pkg/**
sonar.test.inclusions=**/*.test.*,**/*.spec.*
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Keep type-aware analysis on the repository's four real projects. Detached
# Codex worktrees under .claude/ are intentionally excluded source, but their
# inherited tsconfig files would otherwise be enumerated by the analyzer.
sonar.typescript.tsconfigPaths=tsconfig.json,packages/remote/tsconfig.json,packages/rg-split/tsconfig.json,packages/rg-split/examples/tsconfig.json
# Build, release, migration and live-environment scripts remain static
# quality-scanned above, but execute only under an attached toolchain or
# deployment environment. Their zero-hit process paths must not dilute unit /
# integration coverage of product code; script-specific tests cover the pure
# helpers where deterministic behavior matters.
sonar.coverage.exclusions=**/scripts/**,**/scripts/cdp-*.mjs,**/scripts/*-e2e.mjs,**/scripts/remote-*.mjs,**/scripts/run-weaknet-lab.mjs,**/scripts/tauri-dev-*.mjs,**/scripts/verify-remote-pwa-build.mjs
# Rust LCOV is not produced by the current test workflow; leaving this unset
# avoids Sonar recursively resolving a missing report through transient worktrees.
# TypeScript type-aware analysis is intentionally disabled here: the repository
# contains transient worktrees with incomplete dependency junctions; the
# syntax/coverage analysis remains enabled for the configured source roots.
