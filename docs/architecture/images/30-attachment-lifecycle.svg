<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
  <style>
    .state { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; }
    .state-final { fill: #dafbe1; stroke: #1a7f37; stroke-width: 2; }
    .state-error { fill: #ffebe9; stroke: #cf222e; stroke-width: 2; }
    .label { fill: #24292f; font-weight: 600; font-size: 13; }
    .sub { fill: #57606a; font-size: 11; }
    .arrow { stroke: #57606a; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .arrow-reconnect { stroke: #9a6700; stroke-width: 1.5; fill: none; marker-end: url(#arrow-reconnect); }
    .arrow-error { stroke: #cf222e; stroke-width: 1.5; fill: none; marker-end: url(#arrow-error); }
    .legend-box { fill: #ffffff; stroke: #d0d7de; rx: 4; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-reconnect" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/>
    </marker>
    <marker id="arrow-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
  </defs>

  <text x="360" y="26" text-anchor="middle" class="label" font-size="14">Attachment State Machine v9</text>
  <text x="360" y="46" text-anchor="middle" class="sub">SPEC-L2-REMOTE-001 §3.2 — runtime_epoch 一致则 resume，否则拒绝</text>

  <!-- row 1: initial -->
  <g transform="translate(20,80)">
    <rect class="state" x="0" y="0" width="120" height="50" rx="6"/>
    <text x="60" y="20" text-anchor="middle" class="label">Detached</text>
    <text x="60" y="38" text-anchor="middle" class="sub">initial</text>
  </g>

  <!-- row 1: connecting -->
  <g transform="translate(180,80)">
    <rect class="state" x="0" y="0" width="120" height="50" rx="6"/>
    <text x="60" y="20" text-anchor="middle" class="label">Connecting</text>
    <text x="60" y="38" text-anchor="middle" class="sub">await attach_ack</text>
  </g>

  <!-- row 1: attached -->
  <g transform="translate(340,80)">
    <rect class="state" x="0" y="0" width="120" height="50" rx="6"/>
    <text x="60" y="20" text-anchor="middle" class="label">Attached</text>
    <text x="60" y="38" text-anchor="middle" class="sub">stream + input</text>
  </g>

  <!-- row 1: reconnecting -->
  <g transform="translate(500,80)">
    <rect class="state" x="0" y="0" width="120" height="50" rx="6"/>
    <text x="60" y="20" text-anchor="middle" class="label">Reconnecting</text>
    <text x="60" y="38" text-anchor="middle" class="sub">exp backoff 1→30 s</text>
  </g>

  <!-- row 1: desynced -->
  <g transform="translate(20,170)">
    <rect class="state-error" x="0" y="0" width="120" height="50" rx="6"/>
    <text x="60" y="20" text-anchor="middle" class="label">Desynced</text>
    <text x="60" y="38" text-anchor="middle" class="sub">seq gap</text>
  </g>

  <!-- row 1: closing -->
  <g transform="translate(180,170)">
    <rect class="state" x="0" y="0" width="120" height="50" rx="6"/>
    <text x="60" y="20" text-anchor="middle" class="label">Closing</text>
    <text x="60" y="38" text-anchor="middle" class="sub">client tear down</text>
  </g>

  <!-- row 1: failed -->
  <g transform="translate(340,170)">
    <rect class="state-error" x="0" y="0" width="120" height="50" rx="6"/>
    <text x="60" y="20" text-anchor="middle" class="label">Failed</text>
    <text x="60" y="38" text-anchor="middle" class="sub">auth / 401</text>
  </g>

  <!-- arrows row 1 -->
  <line class="arrow" x1="140" y1="105" x2="180" y2="105" />
  <text x="160" y="99" text-anchor="middle" class="sub">attach</text>
  <line class="arrow" x1="300" y1="105" x2="340" y2="105" />
  <text x="320" y="99" text-anchor="middle" class="sub">ack</text>
  <line class="arrow-reconnect" x1="460" y1="105" x2="500" y2="105" stroke-dasharray="3,2" />
  <text x="480" y="99" text-anchor="middle" class="sub">heartbeat miss</text>
  <line class="arrow" x1="620" y1="105" x2="640" y2="195" stroke-dasharray="3,2" />

  <!-- resync -->
  <line class="arrow" x1="80" y1="170" x2="380" y2="170" stroke-dasharray="3,2" />
  <text x="200" y="164" text-anchor="middle" class="sub">replay → snapshot</text>

  <!-- detach -->
  <line class="arrow" x1="240" y1="170" x2="220" y2="130" stroke-dasharray="3,2" />
  <text x="225" y="148" class="sub">detach</text>

  <!-- invariants -->
  <g transform="translate(20,250)">
    <rect class="legend-box" x="0" y="0" width="680" height="118" rx="6"/>
    <text x="14" y="18" class="label">不变量</text>
    <text x="14" y="38" class="sub">· terminal 进入 Exited 不驱动 attachment state machine</text>
    <text x="14" y="56" class="sub">· runtime_epoch stale → error{runtime_epoch_stale, expected, received}</text>
    <text x="14" y="74" class="sub">· Exited terminal 期间 input 必拒 {error:session_closed}</text>
    <text x="14" y="92" class="sub">· same runtime_epoch + seq gap → desync → replay → snapshot</text>
    <text x="14" y="110" class="sub">· attachment 不接受 silent rebind；terminal_id mismatch 必显式拒绝</text>
  </g>
</svg>
