<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>WebGL2 probe — diagnostic only</title>
<style>
body { font: 14px/1.4 monospace; background: #0d1117; color: #c9d1d9; padding: 16px; margin: 0; }
h1 { font-size: 16px; margin: 0 0 12px 0; }
#out { margin: 12px 0; }
table { border-collapse: collapse; }
th { text-align: left; padding: 2px 12px 2px 0; color: #8b949e; font-weight: normal; }
td { padding: 2px 0; }
canvas { display: block; margin: 12px 0; border: 1px solid #30363d; }
ul { padding-left: 18px; }
li { color: #8b949e; }
.flag-ok { color: #3fb950; }
.flag-fail { color: #f85149; }
</style>
</head>
<body>
<h1>WebGL2 probe — diagnostic only (NOT a product E2E)</h1>
<div id="out"></div>
<ul id="log"></ul>
<script>
// Minimal WebGL2 probe — diagnostic only, NOT a product E2E.
// Lives at /diag/webgl2-probe.html served by ridge for the AVD run only.
(function () {
  function el(tag, attrs, text) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }
  function row(k, v) {
    var r = el('tr');
    r.appendChild(el('th', null, k));
    r.appendChild(el('td', null, String(v)));
    return r;
  }
  function log(label, msg) {
    var ul = document.getElementById('log');
    var li = el('li', null, '[' + new Date().toISOString() + '] ' + label + ' :: ' + msg);
    ul.appendChild(li);
  }

  var out = document.getElementById('out');
  var t0 = performance.now();
  var table = el('table');
  table.appendChild(row('userAgent', navigator.userAgent));
  table.appendChild(row('platform', navigator.platform));
  table.appendChild(row('GLES (via UA hint)', /ANGLE \(.*?\)/.exec(navigator.userAgent) ? RegExp.lastMatch : '(none)'));
  table.appendChild(row('SwiftShader?', /SwiftShader/i.test(navigator.userAgent) ? 'YES' : 'no'));
  out.appendChild(table);

  var canvas = el('canvas');
  canvas.width = 256;
  canvas.height = 256;
  canvas.id = 'cv';
  document.body.appendChild(canvas);
  log('boot', 'canvas added');

  var gl = canvas.getContext('webgl2');
  if (!gl) {
    log('webgl2', 'null context');
    out.appendChild(el('p', null, 'WebGL2 NOT AVAILABLE'));
    return;
  }
  log('webgl2', 'got context');
  var dbg = gl.getExtension('WEBGL_debug_renderer_info');
  var renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  var vendor = dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR);
  table.appendChild(row('UNMASKED_RENDERER_WEBGL', renderer));
  table.appendChild(row('UNMASKED_VENDOR_WEBGL', vendor));
  table.appendChild(row('GL_VERSION', gl.getParameter(gl.VERSION)));
  table.appendChild(row('GL_SHADING_LANGUAGE_VERSION', gl.getParameter(gl.SHADING_LANGUAGE_VERSION)));
  table.appendChild(row('MAX_TEXTURE_SIZE', gl.getParameter(gl.MAX_TEXTURE_SIZE)));

  // Minimal fragment shader — paint full-screen solid red.
  var vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, '#version 300 es\nin vec2 a;void main(){gl_Position=vec4(a,0.0,1.0);}');
  gl.compileShader(vs);
  if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) {
    log('vs', gl.getShaderInfoLog(vs));
  }
  var fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, '#version 300 es\nprecision mediump float;out vec4 o;void main(){o=vec4(1.0,0.0,0.0,1.0);}');
  gl.compileShader(fs);
  if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
    log('fs', gl.getShaderInfoLog(fs));
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    log('link', gl.getProgramInfoLog(prog));
  }
  gl.useProgram(prog);
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  gl.viewport(0, 0, 256, 256);
  gl.clearColor(0, 0, 1, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.finish();

  // Read back pixels at known positions.
  var pTL = new Uint8Array(4);
  var pBR = new Uint8Array(4);
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pTL);
  gl.readPixels(128, 128, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pBR);
  table.appendChild(row('pixel TL (after clear+draw)', Array.from(pTL).join(',')));
  table.appendChild(row('pixel BR (inside tri)', Array.from(pBR).join(',')));
  // Save canvas to dataURL and stash on window for screencap diff.
  window.__probeCanvas = canvas;
  window.__probeDataURL = canvas.toDataURL('image/png');
  log('paint', 'first draw + readPixels done in ' + (performance.now() - t0).toFixed(1) + 'ms');

  // Second frame test — schedule a RAF and re-draw to see if subsequent draws paint.
  var frames = 0;
  var tFrame = performance.now();
  function tick() {
    frames++;
    var t = performance.now() * 0.002;
    gl.clearColor(0.5 + 0.5 * Math.sin(t), 0.5 + 0.5 * Math.cos(t), 0.5, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.finish();
    if (frames < 5) requestAnimationFrame(tick);
    else {
      var dt = performance.now() - tFrame;
      table.appendChild(row('RAF frames', frames));
      table.appendChild(row('RAF ms total', dt.toFixed(1)));
      var pC = new Uint8Array(4);
      gl.readPixels(128, 128, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pC);
      table.appendChild(row('pixel mid (after RAF#5)', Array.from(pC).join(',')));
      log('raf', '5 frames ok in ' + dt.toFixed(1) + 'ms');
      window.__probeDone = true;
    }
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
