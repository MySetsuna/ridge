name: MSI Runtime acceptance
on:
  push:
    branches: [codex/msi-runtime-guard]
  workflow_dispatch:
    inputs:
      full_package:
        description: Build and inspect the complete Tauri MSI candidate
        type: boolean
        default: false
      candidate_run:
        description: Completed full-package run whose exact MSI will be installed
        type: string
        default: ''
permissions:
  contents: read
jobs:
  lifecycle-probe:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: swatinem/rust-cache@v2
        with:
          key: msi-runtime-helper
          cache-on-failure: true
      - name: Build actual Kernel installer helper
        shell: pwsh
        run: |
          cargo build --locked -p ridge-kernel --bin ridge-kernel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked -p ridge-cli --bin ridge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check actual Windows transaction ownership semantics
        shell: pwsh
        run: |
          cargo test --locked -p ridge-kernel --lib installer::tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download pinned WiX 3.14.1
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          Invoke-WebRequest 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $zip
          $digest = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($digest -ne '6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31') { throw 'WiX download hash mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'wix314')
      - name: Exercise isolated MSI lifecycle
        shell: pwsh
        run: |
          ./scripts/msi-runtime-acceptance.ps1 -ProbeOnly -KernelPath "$env:GITHUB_WORKSPACE/target/debug/ridge-kernel.exe" -WixDirectory "$env:RUNNER_TEMP/wix314" -OutputDirectory "$env:RUNNER_TEMP/ridge-msi-probe"
      - name: Exercise production WiX guard with isolated payload
        shell: pwsh
        run: |
          ./scripts/msi-runtime-acceptance.ps1 -ProductionGuard -KernelPath "$env:GITHUB_WORKSPACE/target/debug/ridge-kernel.exe" -CliPath "$env:GITHUB_WORKSPACE/target/debug/ridge.exe" -WixDirectory "$env:RUNNER_TEMP/wix314" -OutputDirectory "$env:RUNNER_TEMP/ridge-msi-guard"
      - name: Upload actual MSI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msi-lifecycle-probe
          path: |
            ${{ runner.temp }}/ridge-msi-probe
            ${{ runner.temp }}/ridge-msi-guard
            !${{ runner.temp }}/ridge-msi-guard/**/missing-cleanup.msi
            !${{ runner.temp }}/ridge-msi-guard/**/installed/**
          if-no-files-found: error

  candidate-lifecycle:
    if: github.event_name == 'workflow_dispatch' && inputs.candidate_run != ''
    needs: lifecycle-probe
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify candidate producer
        env:
          GH_TOKEN: ${{ github.token }}
          RIDGE_MSI_CANDIDATE_RUN: ${{ inputs.candidate_run }}
        shell: pwsh
        run: |
          if ($env:RIDGE_MSI_CANDIDATE_RUN -notmatch '^\d+$') { throw 'Candidate run must be numeric.' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RIDGE_MSI_CANDIDATE_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.repository.full_name -ne $env:GITHUB_REPOSITORY -or
              $run.name -ne 'MSI Runtime acceptance' -or $run.status -ne 'completed' -or $run.conclusion -ne 'success') { throw 'Candidate producer did not complete successfully in this repository.' }
          "RIDGE_MSI_PACKAGE_SOURCE=$($run.head_sha)" >> $env:GITHUB_ENV
      - uses: actions/download-artifact@v4
        with:
          name: complete-tauri-msi-candidate
          path: ${{ runner.temp }}/ridge-full-msi-input
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run }}
      - name: Exercise exact complete MSI candidate
        id: native_lifecycle
        shell: pwsh
        run: |
          $inputRoot = Join-Path $env:RUNNER_TEMP 'ridge-full-msi-input'
          $manifest = Get-Content (Join-Path $inputRoot 'package-contract.json') -Raw | ConvertFrom-Json
          if ($manifest.source -ne $env:RIDGE_MSI_PACKAGE_SOURCE) { throw 'Candidate package does not match its producer source.' }
          $output = Join-Path $env:RUNNER_TEMP 'ridge-full-msi-native'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          [pscustomobject]@{ producerSource = $manifest.source; driverSource = $env:GITHUB_SHA; expectedPackageSha256 = $manifest.packageSha256 } |
            ConvertTo-Json | Set-Content (Join-Path $output 'provenance.json')
          ./scripts/msi-runtime-acceptance.ps1 -PackagePath (Join-Path $inputRoot $manifest.package) -OutputDirectory $output
          $report = Get-Content (Join-Path $output 'full-package-results.json') -Raw | ConvertFrom-Json
          if ($report.cases.Count -ne 3 -or $report.packageSha256 -ne $manifest.packageSha256) { throw 'Complete-package native acceptance is incomplete.' }
      - uses: actions/upload-artifact@v4
        if: always() && steps.native_lifecycle.outcome != 'skipped'
        with:
          name: complete-msi-native-lifecycle
          path: |
            ${{ runner.temp }}/ridge-full-msi-native
            !${{ runner.temp }}/ridge-full-msi-native/installed-ridge/**
            !${{ runner.temp }}/ridge-full-msi-native/package-installer-helper.exe
          if-no-files-found: error

  full-package:
    if: github.event_name == 'workflow_dispatch' && inputs.full_package
    needs: lifecycle-probe
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      # Match release.yml: Cargo discovers MSVC. VsDevCmd's PLATFORM=x64
      # conflicts with wasm-pack-action's operating-system selector.
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: swatinem/rust-cache@v2
        with:
          key: msi-full-package
          cache-on-failure: true
      - run: rustup target add wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - name: Preserve the independent production CLI before the GUI build
        shell: pwsh
        run: |
          cargo build --locked --release -p ridge-cli --bin ridge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory target/ridge-cli-artifact -Force | Out-Null
          Copy-Item target/release/ridge.exe target/ridge-cli-artifact/ridge.exe
          $help = & target/ridge-cli-artifact/ridge.exe --help
          if ($LASTEXITCODE -ne 0 -or ($help -join "`n") -notmatch 'Ridge headless remote host') { throw 'Independent CLI staging failed.' }
      - name: Build complete Tauri MSI from this source
        id: build_package
        run: pnpm exec tauri build --bundles msi
      - name: Verify the actual MSI action and Binary contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem target/release/bundle/msi/*.msi -ErrorAction Stop)
          if ($packages.Count -ne 1) { throw 'Expected exactly one complete MSI candidate.' }
          $msi = $packages[0]
          $output = Join-Path $env:RUNNER_TEMP 'ridge-full-msi-artifacts'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          Copy-Item -LiteralPath $msi.FullName -Destination $output
          Copy-Item target/ridge-cli-artifact/ridge.exe (Join-Path $output 'ridge-cli.exe')
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase($msi.FullName, 0)
          function Read-Rows([string]$Query, [int]$Columns) {
            $view = $database.OpenView($Query)
            [void]$view.Execute()
            try {
              while ($record = $view.Fetch()) {
                try { $row = @(); for ($i = 1; $i -le $Columns; $i++) { $row += $record.StringData($i) }; ,$row }
                finally { [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($record) }
              }
            } finally { [void]$view.Close(); [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($view) }
          }
          try {
            $sequence = @{}; foreach ($row in (Read-Rows 'SELECT `Action`,`Sequence` FROM `InstallExecuteSequence`' 2)) { $sequence[$row[0]] = [int]$row[1] }
            foreach ($name in @('RidgeRuntimeReserve', 'RidgeRuntimeVerify', 'RidgeRuntimeRelease', 'InstallValidate', 'InstallInitialize', 'InstallFinalize')) {
              if (!$sequence.ContainsKey($name)) { throw "Complete MSI omits required action $name" }
            }
            if ($sequence.RidgeRuntimeReserve -ge $sequence.InstallValidate -or $sequence.RidgeRuntimeVerify -ge $sequence.InstallInitialize -or
                $sequence.RidgeRuntimeVerify -le $sequence.RidgeRuntimeReserve -or $sequence.RidgeRuntimeRelease -le $sequence.InstallFinalize -or
                ($sequence.ContainsKey('RemoveExistingProducts') -and $sequence.RidgeRuntimeVerify -ge $sequence.RemoveExistingProducts)) { throw 'Complete MSI protection sequence is unsafe.' }
            $actions = @{}; foreach ($row in (Read-Rows 'SELECT `Action`,`Type`,`Source`,`Target` FROM `CustomAction`' 4)) { $actions[$row[0]] = $row }
            foreach ($name in @('RidgeRuntimeReserve', 'RidgeRuntimeVerify')) {
              $action = $actions[$name]
              if (!$action -or ([int]$action[1] -band 0x3f) -ne 2 -or ([int]$action[1] -band 0xc0) -ne 0 -or
                  $action[2] -ne 'RidgeInstallHost' -or $action[3] -notmatch '--installer-msi-action') { throw 'Complete MSI does not enforce a synchronous Runtime return code.' }
            }
            $errors = @(Read-Rows 'SELECT `Error`,`Message` FROM `Error` WHERE `Error`=1722' 2)
            if ($errors.Count -ne 1 -or $errors[0][1] -notmatch 'explicitly stop the Runtime service') { throw 'Complete MSI omits actionable Runtime refusal text.' }
            $view = $database.OpenView('SELECT `Data` FROM `Binary` WHERE `Name`=''RidgeInstallHost''')
            [void]$view.Execute(); $record = $view.Fetch()
            if (!$record) { throw 'Complete MSI omits its actual Runtime helper.' }
            $hash = [Security.Cryptography.IncrementalHash]::CreateHash([Security.Cryptography.HashAlgorithmName]::SHA256)
            try {
              $size = 0L
              while ($true) {
                [string]$chunk = $record.ReadStream(1, 65536, 1)
                if (!$chunk.Length) { break }
                $bytes = [Text.Encoding]::GetEncoding(28591).GetBytes($chunk)
                $hash.AppendData($bytes); $size += $bytes.Length
              }
              $embedded = [Convert]::ToHexString($hash.GetHashAndReset()).ToLowerInvariant()
            } finally {
              $hash.Dispose(); [void]$view.Close()
              foreach ($handle in @($record, $view)) { [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($handle) }
            }
            $expected = (Get-FileHash target/runtime-binaries/ridge-kernel-installer.exe -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($size -lt 1MB -or $embedded -ne $expected) { throw 'Embedded MSI helper differs from the actual source build.' }
            [pscustomobject]@{ source = $env:GITHUB_SHA; package = $msi.Name; packageSha256 = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash;
              embeddedHelperSha256 = $embedded; embeddedHelperBytes = $size; sequence = $sequence;
              scope = 'Complete production Tauri MSI build and database inspection'; productionAcceptance = $false
            } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $output 'package-contract.json')
          } finally { foreach ($handle in @($database, $installer)) { [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($handle) } }
      - name: Upload unpublished complete MSI candidate
        if: always() && steps.build_package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: complete-tauri-msi-candidate
          path: ${{ runner.temp }}/ridge-full-msi-artifacts
          if-no-files-found: error
