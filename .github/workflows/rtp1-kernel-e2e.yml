name: kernel-runtime-e2e

# Original desktop CLI harness: docs/archive/CHG-084/rtp1-kernel-e2e.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install native font dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev pkg-config
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-kernel-runtime-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-kernel-runtime-
      - name: Real Kernel Remote and Commune regressions
        run: cargo test --locked -p ridge-kernel --test remote_invoke_runtime --test commune_registration --test commune_group_tasks --test runtime_workspace_continuity --test cwd_runtime --test workspace_file_owner -- --test-threads=1 2>&1 | tee kernel-runtime-e2e.log
      - name: Upload regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-runtime-e2e-log
          path: kernel-runtime-e2e.log
          if-no-files-found: ignore
          retention-days: 7
