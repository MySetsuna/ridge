[package]
name = "ridge-remote"
version = "0.1.0"
edition = "2021"
description = "Shared LAN remote-control server logic (TLS certs, HTTP/WS server, TOTP auth)"
license = "MIT"

[dependencies]
# HTTP + WS server
axum = { version = "0.7", features = ["ws", "macros"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
# 响应体压缩层（gzip/br，按 Accept-Encoding 协商）——前端 serve 装配用
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br"] }
# TLS cert generation (ring backend — no cmake needed on Windows)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "crypto"] }
time = { version = "0.3", default-features = false, features = ["std"] }
# Config paths (cross-platform data dir for TLS material)
dirs = "5"
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Async runtime
tokio = { version = "1", features = ["sync", "net", "io-util"] }
# Errors
anyhow = "1"
tracing = "0.1"
# Base64 decode for DER conversion
base64 = "0.22"
# TOTP auth engine (RemoteTotp) — shared, zero Tauri dependency
ridge-core = { path = "../ridge-core" }
# Terminal modes SSOT for the pane resync frame (build_resync_frame + Modes).
# default-features=false 跳过 webgpu（wasm-only、cfg-gated），原生只取 vte 解析核。
ridge-term = { path = "../ridge-term", default-features = false }
# pane-id 二进制帧的 16 字节前缀
uuid = { version = "1" }
# Interior mutability for session/throttle/auth state
parking_lot = "0.12"
# OS CSPRNG for unguessable session tokens (audit C2)
getrandom = "0.2"
# 可选：把统一 Remote SPA 产物编进二进制（`embed-ui` feature，rdg CLI 用）。
# `interpolate-folder-path`：`#[folder = "$CARGO_MANIFEST_DIR/../../remote-dist"]`
# 需要它才会展开环境变量（否则把 `$CARGO_MANIFEST_DIR` 当字面目录名→编译期报错）。
# `include-exclude`：桌面产物里的 docs 与首页配图不服务 Remote，排除以减体积。
# `compression`：桌面/移动 SPA 此前逐字节原样进二进制——rdg 体积的大头是它，不是代码
# （二进制已 `strip` + thin LTO）。开压缩后按 deflate 存、首次读取时惰性解压。
# 同机实测（Windows x64，`cargo build --release -p ridge-cli --bin rdg`）：
#   关：44.1 MiB → 开：30.1 MiB，**减 14.0 MiB（−32%）**。
# 代价：多一条 `include-flate`→`zstd-sys` 的原生依赖（构建机需 C 编译器；三平台 CI
# runner 自带），以及每个文件首次读取时解压一次。release 才真正内嵌，debug 下
# rust-embed 仍从磁盘读，故验收必须用 `--release`。
rust-embed = { version = "8", optional = true, default-features = false, features = ["interpolate-folder-path", "include-exclude", "compression"] }

[dev-dependencies]
# 端到端 serve 钉（tests/ua_fork_serve.rs）需要多线程 runtime + `#[tokio::test]`；
# HTTP 请求是手写的 TCP，不引第三方 client。
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "io-util"] }

[features]
default = []
# 单文件分发的 CLI（rdg）打开它：`remote-dist` 产物随二进制走，
# 免去「exe 旁必须有 Remote 静态目录」的隐式依赖（REMOTE_UI_MISSING 根因）。
embed-ui = ["dep:rust-embed"]
