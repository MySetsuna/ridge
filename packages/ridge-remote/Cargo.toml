[package]
name = "ridge-remote"
version = "0.1.0"
edition = "2021"
description = "Shared LAN remote-control server logic (TLS certs, HTTP/WS server, TOTP auth)"
license = "MIT"

[dependencies]
# HTTP + WS server
axum = { version = "0.7", features = ["ws", "macros"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
# 响应体压缩层（gzip/br，按 Accept-Encoding 协商）——前端 serve 装配用
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br"] }
# TLS cert generation (ring backend — no cmake needed on Windows)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "crypto"] }
time = { version = "0.3", default-features = false, features = ["std"] }
# Config paths (cross-platform data dir for TLS material)
dirs = "5"
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Async runtime
tokio = { version = "1", features = ["sync", "net", "io-util"] }
# Errors
anyhow = "1"
tracing = "0.1"
# Base64 decode for DER conversion
base64 = "0.22"
# TOTP auth engine (RemoteTotp) — shared, zero Tauri dependency
ridge-core = { path = "../ridge-core" }
# Terminal modes SSOT for the pane resync frame (build_resync_frame + Modes).
# default-features=false 跳过 webgpu（wasm-only、cfg-gated），原生只取 vte 解析核。
ridge-term = { path = "../ridge-term", default-features = false }
# pane-id 二进制帧的 16 字节前缀
uuid = { version = "1" }
# Interior mutability for session/throttle/auth state
parking_lot = "0.12"
# OS CSPRNG for unguessable session tokens (audit C2)
getrandom = "0.2"

[features]
default = []
