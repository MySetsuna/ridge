[package]
name = "ridge-kernel"
version = "0.1.0"
edition = "2021"
description = "Ridge kernel process — control plane SSOT host (REQ-RIDGE-KERNEL-HOST-01)"
license = "MIT"
default-run = "ridge-kernel"

[[bin]]
name = "ridge-kernel"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "5"
futures = "0.3"
parking_lot = "0.12"
portable-pty = "0.8"
ridge-core = { path = "../ridge-core" }
ridge-mcp = { path = "../ridge-mcp", features = ["axum-transport"] }
ridge-term = { path = "../ridge-term", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "net", "time"] }
tokio-tungstenite = "0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7"] }
thiserror = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# integration smoke via binary spawn uses std only
