[package]
name = "ridge-kernel"
version = "0.1.0"
edition = "2021"
description = "Ridge kernel process — control plane SSOT host (REQ-RIDGE-KERNEL-HOST-01)"
license = "MIT"
default-run = "ridge-kernel"

[[bin]]
name = "ridge-kernel"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
dirs = "5"
ridge-core = { path = "../ridge-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "net", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# integration smoke via binary spawn uses std only
